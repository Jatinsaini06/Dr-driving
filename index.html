<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#182b37">
<title>City Shift — Model Town to Sondhapur, Panipat</title>
<style>
:root{
 --bg:#142630;--panel:#172c38f5;--line:#ffffff20;
 --text:#f2f7fa;--muted:#a9c0ce;--accent:#65edbe;--gold:#ffd275;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);
 color:var(--text);font-family:system-ui,-apple-system,sans-serif;
 touch-action:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--gold)}
.hidden{display:none!important}
#loading{position:fixed;inset:0;display:grid;place-items:center;
 background:var(--bg);z-index:100;text-align:center;padding:30px}
#loading h1{letter-spacing:6px}
#loading p{color:var(--muted);max-width:500px;line-height:1.6}
#screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;
 justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px;
 background:linear-gradient(90deg,#10212ccd,#10212c25)}
.panel{width:min(570px,100%);max-height:94dvh;overflow:auto;
 background:var(--panel);border:1px solid var(--line);border-radius:24px;
 padding:25px;box-shadow:0 20px 80px #0004;touch-action:pan-y}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:3px}
h1{font-size:clamp(32px,7vw,52px);margin:8px 0;letter-spacing:-2px}
h2{margin:5px 0 15px;font-size:27px}h3{margin:0 0 8px}
p{color:var(--muted);line-height:1.55}
.topline,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row{margin:12px 0}.coins{color:var(--gold);font-weight:800;white-space:nowrap}
.btn{border:1px solid var(--line);background:#ffffff09;border-radius:12px;
 padding:13px 17px;font-weight:750}
.btn:hover{background:#ffffff18}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#103429}
.btn.gold{background:var(--gold);color:#3a2c10}
.full{width:100%;margin-top:9px}
.small{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:9px;margin:15px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;
 background:#ffffff05;text-align:left;width:100%}
.card b{display:block;margin-bottom:4px}
.card span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{margin:12px 0;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:5px;background:#ffffff14;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.badge{display:inline-block;padding:5px 9px;border-radius:8px;
 background:#65edbe18;color:var(--accent);font-size:11px;font-weight:800}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#hudTop{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;
 right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hudBox{background:#142630e8;border:1px solid var(--line);
 border-radius:15px;padding:11px 13px;box-shadow:0 4px 16px #0002}
#objectiveBox{max-width:min(440px,70vw)}
#objectiveTitle{font-weight:800;font-size:14px}
#objectiveDetail{font-size:11px;color:var(--muted);margin-top:5px}
#objectiveProgress{height:4px;background:#ffffff15;margin-top:8px;border-radius:3px}
#objectiveProgress i{display:block;height:100%;background:var(--accent);width:0}
#hudRight{display:flex;gap:7px;align-items:flex-start}
#pauseButton{pointer-events:auto;font-size:19px;padding:9px 14px}
#timer{font-weight:850;font-variant-numeric:tabular-nums;font-size:21px}
#health{font-size:10px;color:var(--accent);margin-top:2px}
#map{position:absolute;right:12px;top:100px;width:142px;height:142px;
 background:#18323fe8;border:1px solid #ffffff40;border-radius:17px}
#navigation{position:absolute;left:12px;top:106px;display:flex;align-items:center;gap:10px}
#navArrow{font-size:29px;display:inline-block;color:var(--accent);line-height:1}
#navDistance{font-weight:800;font-size:17px}
#navHint{font-size:10px;color:var(--muted);margin-top:2px}
#speedBox{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));
 left:50%;transform:translateX(-50%);text-align:center;min-width:92px;padding:10px}
#speed{font-size:36px;font-weight:900;line-height:1}
#gearReadout{font-size:11px;color:var(--accent);margin-top:5px}
#distanceReadout{font-size:10px;color:var(--muted);margin-top:5px}
#notice{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);
 background:#172c38ed;border:1px solid #ffffff30;padding:12px 20px;
 border-radius:13px;font-weight:800;text-align:center;max-width:85vw;
 opacity:0;transition:opacity .15s}
#input{position:fixed;inset:0;z-index:5;pointer-events:none}
#wheelZone{position:absolute;left:max(18px,env(safe-area-inset-left));
 bottom:max(25px,env(safe-area-inset-bottom));width:146px;height:146px;
 pointer-events:auto;touch-action:none;display:grid;place-items:center}
#wheel{width:132px;height:132px;border:12px solid #e2f0f2c9;border-radius:50%;
 background:#16354470;box-shadow:0 4px 20px #0004;position:relative}
#wheel:before{content:"";position:absolute;left:calc(50% - 7px);top:43px;
 width:14px;height:65px;background:#e2f0f2c9;border-radius:8px}
#wheel:after{content:"";position:absolute;left:8px;right:8px;top:42px;
 height:14px;background:#e2f0f2c9;border-radius:8px}
#wheelLabel{position:absolute;top:-16px;font-size:9px;letter-spacing:2px;
 color:white;text-shadow:0 1px 4px #000}
#pedals{position:absolute;right:max(18px,env(safe-area-inset-right));
 bottom:max(25px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;
 gap:10px;pointer-events:auto}
.pedal{width:64px;height:92px;border:2px solid #ffffff50;border-radius:15px;
 background:#173542c9;touch-action:none;font-size:11px;font-weight:900;
 box-shadow:0 5px 20px #0003}
.pedal.gas{height:124px;background:#267c66d9;border-color:#92f8d6}
.pedal.pressed{background:#ffffff95;color:#14332c;transform:translateY(3px)}
#reverse{position:absolute;right:22px;bottom:165px;pointer-events:auto;
 background:#172c38dd;border:1px solid #ffffff50;border-radius:10px;
 padding:10px 16px;font-size:12px;font-weight:900}
#footer{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
@media(max-width:480px){
 .panel{padding:19px;border-radius:19px}
 #map{width:108px;height:108px;top:110px}
 #wheelZone{width:120px;height:120px;left:10px}
 #wheel{width:112px;height:112px;border-width:10px}
 #wheel:before{top:34px;height:54px}
 #wheel:after{top:34px}
 #pedals{right:10px;gap:7px}.pedal{width:54px;height:82px}
 .pedal.gas{height:111px}
 #speedBox{min-width:66px;padding:9px 5px;bottom:28px}
 #speed{font-size:29px}#reverse{right:12px;bottom:151px}
 #objectiveTitle{font-size:12px}#objectiveBox{max-width:64vw}
 #timer{font-size:18px}.hudBox{padding:10px}
}
@media(max-height:500px){
 #screen{padding:8px}.panel{max-height:96dvh}
 #map{width:95px;height:95px;top:86px}
 #navigation{top:87px}#wheelZone{bottom:10px;width:110px;height:110px}
 #wheel{transform:scale(.85)}#pedals{bottom:10px}
 .pedal{height:65px}.pedal.gas{height:92px}
 #reverse{bottom:113px}#speedBox{bottom:12px}
}
/* ---- Nexdew weapons / Vishesh boss fight (all inside #hud) ---- */
#enemyPanel{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 150px);
 width:min(330px,calc(100vw - 184px));background:#2a1216e8;border-color:#ff5a6a80}
#enemyName{font-size:12px;font-weight:850;color:#ffb3bb;letter-spacing:.4px}
#enemyPanel .bar{height:9px;margin-top:6px}
#enemyPanel .bar i{background:linear-gradient(90deg,#e0263a,#ff9a3d);transition:width .18s}
#enemySub{font-size:10px;color:var(--muted);margin-top:5px}
.card .btn{white-space:nowrap}
#jokeBubble{position:absolute;left:50%;top:57%;transform:translateX(-50%);
 width:max-content;max-width:min(460px,88vw);background:#fff8dcf5;color:#3a2c10;
 border:2px solid var(--gold);border-radius:18px;padding:11px 18px;font-weight:750;
 font-size:14px;line-height:1.4;text-align:center;box-shadow:0 8px 30px #0006;
 animation:jokePop .25s ease-out}
#jokeBubble b{color:#c0392b}
@keyframes jokePop{from{transform:translateX(-50%) scale(.6);opacity:0}
 to{transform:translateX(-50%) scale(1);opacity:1}}
#storeBtn{position:absolute;left:50%;transform:translateX(-50%);
 bottom:calc(max(26px,env(safe-area-inset-bottom)) + 124px);pointer-events:auto;
 background:#0a1e2ef2;border:2px solid var(--accent);border-radius:16px;padding:9px 20px;
 font-weight:850;font-size:13px;color:var(--accent);line-height:1.35;white-space:nowrap;
 animation:storeGlow 2s ease-in-out infinite}
#storeBtn small{display:block;font-size:10px;color:var(--muted);font-weight:700}
@keyframes storeGlow{0%,100%{box-shadow:0 4px 18px #65edbe33}50%{box-shadow:0 4px 34px #65edbeaa}}
#weaponHud{position:absolute;left:max(14px,env(safe-area-inset-left));
 bottom:calc(max(25px,env(safe-area-inset-bottom)) + 170px);pointer-events:auto;
 text-align:left;padding:8px 12px;border-color:#65edbe70}
#weaponName{font-size:12px;font-weight:850;color:var(--accent)}
#weaponInfo{font-size:10px;color:var(--muted);margin-top:2px}
#fireBtn{position:absolute;right:max(16px,env(safe-area-inset-right));
 bottom:calc(max(25px,env(safe-area-inset-bottom)) + 196px);width:76px;height:76px;
 border-radius:50%;pointer-events:auto;touch-action:none;
 background:radial-gradient(circle at 38% 35%,#ff6a55,#b30f0f);border:3px solid #ffb0a4;
 font-size:12px;font-weight:900;line-height:1.2;box-shadow:0 4px 24px #ff1a0066}
#fireBtn.pressed{transform:scale(.93);background:radial-gradient(circle at 38% 35%,#ff9a8a,#d31f1f)}
#fireBtn.cooling{filter:saturate(.35) brightness(.8)}
#flash{position:absolute;inset:0;background:#fffbe6;opacity:0;pointer-events:none}
@media(max-width:480px){
 #enemyPanel{width:calc(100vw - 150px)}
 #weaponHud{bottom:172px;left:10px}#fireBtn{bottom:196px;right:12px;width:68px;height:68px}
}
@media(max-height:500px){
 #enemyPanel{top:136px;width:min(300px,calc(100vw - 150px));padding:8px 11px}#enemySub{display:none}
 #weaponHud{bottom:138px}#storeBtn{bottom:104px}
 #fireBtn{right:170px;bottom:14px;width:66px;height:66px}
 #jokeBubble{top:60%;font-size:12px;padding:8px 14px}
}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading"><div><div class="eyebrow">ORIGINAL PROCEDURAL DRIVING GAME</div>
<h1>CITY SHIFT</h1><p id="loadMessage">Building your city…</p></div></div>
<div id="screen"></div>
<div id="hud" class="hidden">
 <div id="hudTop">
  <div class="hudBox" id="objectiveBox">
   <div id="objectiveTitle"></div><div id="objectiveDetail"></div>
   <div id="objectiveProgress"><i></i></div>
  </div>
  <div id="hudRight">
   <div class="hudBox"><div id="timer">0:00</div><div id="health">CAR 100%</div></div>
   <button class="btn hudBox" id="pauseButton">Ⅱ</button>
  </div>
 </div>
 <canvas id="map" width="288" height="288"></canvas>
 <div id="navigation" class="hudBox"><span id="navArrow">↑</span>
  <div><div id="navDistance"></div><div id="navHint">NEXT CHECKPOINT</div></div>
 </div>
 <div id="speedBox" class="hudBox"><div id="speed">0</div>
  <div class="small">km/h</div><div id="gearReadout">D · DRIVE</div>
  <div id="distanceReadout">0 m</div>
 </div>
 <div id="notice"></div>
 <div id="enemyPanel" class="hudBox hidden"><div id="enemyName"></div>
  <div class="bar"><i id="enemyHp"></i></div><div id="enemySub"></div></div>
 <div id="jokeBubble" class="hidden"></div>
 <button id="storeBtn" class="hidden">⚡ Enter Nexdew Technologies<small>Weapon store · mods for your ride</small></button>
 <button id="weaponHud" class="hudBox hidden"><div id="weaponName"></div><div id="weaponInfo"></div></button>
 <button id="fireBtn" class="hidden">🔥<br>FIRE</button>
 <div id="flash"></div>
</div>
<div id="input" class="hidden">
 <div id="wheelZone"><span id="wheelLabel">DRAG TO STEER</span><div id="wheel"></div></div>
 <button id="reverse">D ⇄ R</button>
 <div id="pedals"><button class="pedal" id="brake">BRAKE</button>
 <button class="pedal gas" id="gas">GAS<br>▲</button></div>
</div>

<script type="module">
let THREE;
try {
 THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
} catch (e) {
 document.getElementById('loadMessage').textContent =
  'Could not load the 3D library. Check your internet connection and reload. If necessary, serve this file with a local HTTP server.';
 throw e;
}

const $ = id => document.getElementById(id);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const lerp = (a,b,t) => a+(b-a)*t;
const angleDiff = (a,b) => Math.atan2(Math.sin(a-b),Math.cos(a-b));
const distance = (a,b) => Math.hypot(a.x-b.x,a.z-b.z);
const GRID = [-160,-80,0,80,160];
// Stylised Model Town → Sondhapur, Panipat. Blocks are indexed i (west→east), j (north→south).
// Sondhapur sits west of the city on Jattal Road (z=0); G.T. Road / NH-44 is the east road (x=160).
const DISTRICTS = {
 gateX:-111.5,
 noTrees:[[13,23]], // keeps the Model Town direction board visible from the start
 kind:(i,j)=>i===0?(j===1||j===2?'village':'fields'):i===1?'jattal':i===2&&j===1?'market':'colony',
 style:{
  village:{size:9,h:3.6,extra:2.4,roof:0xb99a70,palette:[0xe2c792,0xf1e6cf,0xd9a877,0xe7b9a4,0xcfc8b0]},
  jattal:{size:15,h:8,extra:11,roof:0x78868a,palette:[0xd6c6a4,0xb6c7c6,0xc3b6a8,0x9eafb7,0xd6b39e,0xc1cbaf]},
  market:{size:16,h:9,extra:6,roof:0x78868a,palette:[0xe8d6b0,0xc9d8d0,0xe2c2a8,0xd0c7de]},
  colony:{size:13,h:6.5,extra:5,roof:0xa9a39a,palette:[0xf0e2c8,0xe8cfc0,0xd7e0d0,0xf3ead8,0xd9cbe0,0xe4d1a8]}
 },
 labels:[['SONDHAPUR',-120,-40,'#ffd275'],['JATTAL RD',-40,0,'#e8ecef'],
  ['MODEL TOWN',80,40,'#9ff5d6'],['MARKET',40,-40,'#9ff5d6']]
};
const SIGN_FONT='"Nirmala UI","Mangal","Noto Sans Devanagari",system-ui,sans-serif';
function fitText(ctx,text,x,y,maxWidth,size,color,weight='800'){
 ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
 do{ctx.font=`${weight} ${size}px ${SIGN_FONT}`}while(ctx.measureText(text).width>maxWidth&&--size>8);
 ctx.fillText(text,x,y);
}
const CARS = [
 {name:'Metro S',tag:'Balanced starter sedan',price:0,color:0x45b7ce,
  accel:5.2,brake:10,handling:1,top:22},
 {name:'Sprout',tag:'Light, nimble city hatch',price:950,color:0xf0b84f,
  accel:6,brake:11,handling:1.22,top:23},
 {name:'Executive',tag:'Stable premium cruiser',price:1850,color:0x8493dc,
  accel:6.6,brake:12.4,handling:1.08,top:28},
 {name:'Comet GT',tag:'Fast sport sedan',price:3200,color:0xe8766b,
  accel:8,brake:14,handling:1.3,top:33},
 {name:'ND Chinook',tag:'Tandem-rotor Chinook with the ND logo · Jatin flies, Vishesh rides the door',price:1200,color:0x8a9a5b,
  accel:8.5,brake:12,handling:1.35,top:38,kind:'heli',hx:1.3,hz:4.6,cam:1.8},
 {name:'Side-Seat Scooty',tag:'Scooty with a side seat · Jatin rides, Vishesh sits in the side seat',price:600,color:0xe8743b,
  accel:5.6,brake:10.5,handling:1.4,top:19,kind:'scooty',hx:.95,hz:1.05,cam:.85}
];
// Nexdew Technologies weapon store sits on the colony lot right beside the start (door faces x=0 road).
const STORE={x:26,z:26,door:{x:14,z:26},radius:17};
const BOSS_SPAWN={x:40,z:-80}; // on the road in front of Model Town Market
const RANGE=85;               // auto-aim reach in metres
const JOKE_EVERY=3;           // Vishesh cracks a joke on every 3rd hit
const WEAPONS=[
 {name:'Rubber Bullet Gun',emoji:'🔫',price:100,damage:5,cooldown:.22,speed:60,color:0xffe066,size:.13,
  desc:'Pew pew. Tickles more than it hurts'},
 {name:'Paintball Blaster',emoji:'🎨',price:350,damage:12,cooldown:.32,speed:55,color:0xff4fd8,size:.18,
  desc:'Holi on wheels'},
 {name:'Mirchi Cannon',emoji:'🌶️',price:800,damage:25,cooldown:.55,speed:50,color:0xff3b1f,size:.24,
  desc:'Bhut jolokia shells · extra spicy'},
 {name:'Rocket Launcher',emoji:'🚀',price:1500,damage:50,cooldown:1,speed:44,color:0xff8c1a,size:.3,splash:6,
  desc:'Hits everything in the blast'},

  desc:'Wipes out everything nearby'}
];
const VISHESH_JOKES=[
 'Is that a rubber bullet? My nani throws chappals harder! 🩴',
 'You call that a rocket? I have seen bigger dosas! 🫓',
 'Aim thoda left, bhai… no, your OTHER left!',

const SKELETON_JOKES=[

// ---------- Persistent save / economy ----------
class SaveSystem {
 constructor(){
  this.available=true;
  this.data={coins:2500,selected:0,owned:[0,4,5],upgrades:{},completed:{},
   weapons:[],activeWeapon:-1,settings:{sound:true,quality:'high'}};
  try {
   const raw=JSON.parse(localStorage.getItem('cityshift-save-v1')||'null');
   if(raw&&typeof raw==='object'){
    this.data.coins=Math.max(1500, clamp(Math.floor(Number(raw.coins)||0),0,9999999));
    this.data.owned=[...new Set([0,4,5,...(Array.isArray(raw.owned)?
      raw.owned.filter(v=>Number.isInteger(v)&&v>=0&&v<CARS.length):[])])];
    this.data.selected=this.data.owned.includes(raw.selected)?raw.selected:0;
    for(let i=0;i<CARS.length;i++){
     const u=raw.upgrades?.[i]||{};
     this.data.upgrades[i]={};
     for(const k of ['engine','handling','brakes','speed'])
      this.data.upgrades[i][k]=clamp(Math.floor(Number(u[k])||0),0,3);
    }
    for(let i=0;i<MISSIONS.length;i++){
     const c=raw.completed?.[i];
     if(c&&Number.isFinite(c.stars))
      this.data.completed[i]={stars:clamp(Math.floor(c.stars),1,3)};

class AudioSystem {

   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;

   this.master=c.createGain();this.master.gain.value=this.save.data.settings.sound?.28:0;
   this.master.connect(c.destination);
   this.engineGain=c.createGain();this.engineGain.gain.value=0;
   const filter=c.createBiquadFilter();filter.type='lowpass';filter.frequency.value=550;
   filter.connect(this.engineGain);this.engineGain.connect(this.master);
   this.engine=c.createOscillator();this.engine.type='sawtooth';
   this.engine.frequency.value=45;this.engine.connect(filter);this.engine.start();
   this.harmonic=c.createOscillator();this.harmonic.type='triangle';
   this.harmonic.frequency.value=91;this.harmonic.connect(filter);this.harmonic.start();
   const buffer=c.createBuffer(1,c.sampleRate*2,c.sampleRate);
   const data=buffer.getChannelData(0);
   for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
   this.noiseBuffer=buffer;
   const noise=c.createBufferSource();noise.buffer=buffer;noise.loop=true;
   const ambientFilter=c.createBiquadFilter();ambientFilter.type='lowpass';
   ambientFilter.frequency.value=340;
   this.ambient=c.createGain();this.ambient.gain.value=0;
   noise.connect(ambientFilter);ambientFilter.connect(this.ambient);
   this.ambient.connect(this.master);noise.start();
   const brakes=c.createBufferSource();brakes.buffer=buffer;brakes.loop=true;
   const bf=c.createBiquadFilter();bf.type='bandpass';bf.frequency.value=1700;bf.Q.value=2;
   this.brakeGain=c.createGain();this.brakeGain.gain.value=0;
   brakes.connect(bf);bf.connect(this.brakeGain);this.brakeGain.connect(this.master);
   brakes.start();c.resume().catch(()=>{});
  }catch(e){console.warn('Audio unavailable',e);this.ctx=null}
 }

function overlap(a,b){
 const aa=a.yaw||0,ba=b.yaw||0,dx=b.x-a.x,dz=b.z-a.z;
 if(Math.abs(dx)>a.hx+a.hz+b.hx+b.hz||
    Math.abs(dz)>a.hx+a.hz+b.hx+b.hz)return false;
 const ar={x:Math.cos(aa),z:-Math.sin(aa)},af={x:Math.sin(aa),z:Math.cos(aa)};
 const br={x:Math.cos(ba),z:-Math.sin(ba)},bf={x:Math.sin(ba),z:Math.cos(ba)};
 for(const n of [ar,af,br,bf]){
  const ra=a.hx*Math.abs(ar.x*n.x+ar.z*n.z)+a.hz*Math.abs(af.x*n.x+af.z*n.z);
  const rb=b.hx*Math.abs(br.x*n.x+br.z*n.z)+b.hz*Math.abs(bf.x*n.x+bf.z*n.z);
  if(Math.abs(dx*n.x+dz*n.z)>=ra+rb)return false;
 }
 return true;
}

// ---------- Mobile / keyboard input ----------
class InputSystem {
 constructor(game){
  this.game=game;this.keys=new Set();this.gas=false;this.brake=false;this.fire=false;
  this.steer=0;this.wheelPointer=null;this.pedalPointers={};
  const wheel=$('wheelZone');
  wheel.addEventListener('pointerdown',e=>{
   if(game.state!=='playing'||this.wheelPointer!==null)return;
   this.wheelPointer=e.pointerId;this.startX=e.clientX;
   wheel.setPointerCapture(e.pointerId);e.preventDefault();
  });
  wheel.addEventListener('pointermove',e=>{
   if(e.pointerId!==this.wheelPointer)return;
   this.steer=clamp((e.clientX-this.startX)/58,-1,1);this.drawWheel();
  });
  const releaseWheel=e=>{
   if(e.pointerId===this.wheelPointer){this.wheelPointer=null;this.steer=0;this.drawWheel()}
  };
  wheel.addEventListener('pointerup',releaseWheel);
  wheel.addEventListener('pointercancel',releaseWheel);
  wheel.addEventListener('lostpointercapture',releaseWheel);
  for(const name of ['gas','brake']){
   const el=$(name);
   el.addEventListener('pointerdown',e=>{
    if(game.state!=='playing')return;
    this.pedalPointers[e.pointerId]=name;this[name]=true;
    el.classList.add('pressed');el.setPointerCapture(e.pointerId);e.preventDefault();
   });
   const release=e=>{
    delete this.pedalPointers[e.pointerId];
    this[name]=Object.values(this.pedalPointers).includes(name);
    el.classList.toggle('pressed',this[name]);
   };
   el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);
   el.addEventListener('lostpointercapture',release);
  }
  $('reverse').onclick=()=>game.toggleGear();
  // Double-tap (or double-click) the player's vehicle: Vishesh jumps off.
  const view=$('view'),ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),hitBox=new THREE.Box3();
  let lastTap=-1e9,lastX=0,lastY=0;
  view.addEventListener('pointerdown',e=>{
   if(game.state!=='playing')return;
   const r=view.getBoundingClientRect();
   ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
   ray.setFromCamera(ndc,game.camera);
   hitBox.setFromObject(game.player.mesh).expandByScalar(.5);
   if(!ray.ray.intersectsBox(hitBox)){lastTap=-1e9;return}
   const now=performance.now();
   if(now-lastTap<400&&Math.hypot(e.clientX-lastX,e.clientY-lastY)<70){lastTap=-1e9;game.visheshJump()}
   else{lastTap=now;lastX=e.clientX;lastY=e.clientY}
  });
  window.addEventListener('keydown',e=>{
   if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
   if(e.repeat)return;
   const key=e.key.toLowerCase();
   this.keys.add(key);
   if(key==='r')game.toggleGear();
   if(key==='v')game.visheshJump();
   if(key==='f'&&game.state==='playing'){game.audio.init();game.bossSystem.fire(false)}
   if(key==='q')game.bossSystem.cycleWeapon();
   if(e.key==='Escape'){
    if(game.state==='playing')game.pause();
    else if(game.state==='paused')game.resume();
    else if(game.state==='store')game.closeStore();
   }
  });
  window.addEventListener('keyup',e=>this.keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur',()=>{this.clear();if(game.state==='playing')game.pause()});
  // FIRE: tap for one shot, hold for auto-fire (BossSystem reads this.fire every step).
  const fire=$('fireBtn');
  fire.addEventListener('pointerdown',e=>{
   if(game.state!=='playing')return;
   game.audio.init();this.fire=true;fire.classList.add('pressed');
   fire.setPointerCapture(e.pointerId);game.bossSystem.fire(false);e.preventDefault();
  });
  const releaseFire=()=>{this.fire=false;fire.classList.remove('pressed')};
  for(const type of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(type,releaseFire);
  $('weaponHud').onclick=()=>{game.audio.init();game.bossSystem.cycleWeapon()};
  $('storeBtn').onclick=()=>{game.audio.init();game.audio.click();game.openStore()};
  document.addEventListener('visibilitychange',()=>{
   if(document.hidden){this.clear();if(game.state==='playing')game.pause()}
  });
 }
 drawWheel(){ $('wheel').style.rotate=`${this.steer*70}deg` }
 sample(){
  const k=this.keys;
  return {gas:this.gas||k.has('w')||k.has('arrowup')?1:0,
   brake:this.brake||k.has('s')||k.has('arrowdown')||k.has(' ')?1:0,
   steer:clamp(this.steer+(k.has('d')||k.has('arrowright')?1:0)-
    (k.has('a')||k.has('arrowleft')?1:0),-1,1)};
 }
 clear(){
  this.keys.clear();this.gas=this.brake=this.fire=false;this.steer=0;this.wheelPointer=null;
  this.pedalPointers={};$('gas').classList.remove('pressed');$('brake').classList.remove('pressed');
  $('fireBtn').classList.remove('pressed');
  this.drawWheel();
 }
}

// ---------- Player vehicle / bicycle-model physics ----------
class VehicleController {
 constructor(game){
  this.game=game;this.mesh=null;this.setCar(game.save.data.selected);this.reset();
 }
 setCar(id){
  if(this.mesh)this.game.scene.remove(this.mesh);
  this.clearFallen();
  this.id=id;this.stats=this.game.save.stats(id);this.mesh=vehicleModel(id);
  this.heli=CARS[id].kind==='heli';
  this.game.scene.add(this.mesh);
  if(this.x!==undefined)this.sync();
 }
 reset(){
  if(this.fallen)this.setCar(this.id);
  this.x=4;this.z=32;this.yaw=Math.PI;this.speed=0;this.steer=0;this.alt=0;
  this.gear=1;this.health=100;this.distance=0;this.hitCooldown=0;this.sync();
 }
 bounds(){
  const c=CARS[this.id];
  return {x:this.x,z:this.z,hx:c.hx??.94,hz:c.hz??(this.id===1?1.83:2.08),yaw:this.yaw};
 }
 sync(){
  const bob=this.alt>1?Math.sin(this.game.visualTime*2.3)*.12:0;
  this.mesh.position.set(this.x,.04+(this.alt||0)+bob,this.z);this.mesh.rotation.y=this.yaw;
 }
 groundClear(){
  const b=this.bounds();
  return !this.game.world.colliders.some(c=>overlap(b,c))&&
   !this.game.traffic.cars.some(t=>overlap(b,t.bounds()));
 }
 spin(dt,active){
  const r=this.mesh.userData.rotors;if(!r)return;
  const target=active?(this.alt>.2?26:14):5;
  this.rotorRate=lerp(this.rotorRate||0,target,1-Math.exp(-dt*1.5));
  r[0].rotation.y+=this.rotorRate*dt;r[1].rotation.y-=this.rotorRate*dt;
 }
 jumpVishesh(){
  const riders=this.mesh.userData.riders;
  if(!riders)return 'none';
  if(this.fallen)return 'gone';
  const v=riders.vishesh;this.mesh.updateMatrixWorld(true);this.game.scene.attach(v);
  const fwd=new THREE.Vector3(0,0,1).applyQuaternion(v.quaternion);
  let ox=v.position.x-this.x,oz=v.position.z-this.z;
  const len=Math.hypot(ox,oz)||1;ox/=len;oz/=len;
  v.rotation.order='YXZ';v.rotation.set(0,Math.atan2(fwd.x,fwd.z),0);
  const u=v.userData;
  u.hips.forEach(h=>h.rotation.x=-.5);u.knees.forEach(k=>k.rotation.x=.4);
  this.fallen={obj:v,t:0,landed:false,vy:7.5,puffs:[],
   vx:ox*4+Math.sin(this.yaw)*this.speed*.7,vz:oz*4+Math.cos(this.yaw)*this.speed*.7};
  return 'jumped';
 }
 updateFallen(dt){
  const f=this.fallen;if(!f)return;
  const o=f.obj,u=o.userData;f.t+=dt;
  if(!f.landed){
   f.vy-=20*dt;
   o.position.x+=f.vx*dt;o.position.y+=f.vy*dt;o.position.z+=f.vz*dt;
   o.rotation.x+=3.2*dt;
   u.arms.forEach((a,i)=>a.rotation.set(-2.9+Math.sin(f.t*22+i*3)*.5,0,(i?1:-1)*.4));
   const ground=this.game.world.heightAt(o.position.x,o.position.z);
   if(f.vy<0&&o.position.y<=ground+.16){
    // Lands flat on his back, limbs splayed, X eyes — then the ghost leaves the body.
    f.landed=true;f.ground=ground;f.dead=0;o.position.y=ground+.16;
    o.rotation.set(-Math.PI/2,o.rotation.y,0);
    u.hips.forEach((h,i)=>h.rotation.set(0,0,(i?1:-1)*.25));
    u.knees.forEach(k=>k.rotation.set(0,0,0));
    u.arms.forEach((a,i)=>a.rotation.set(0,0,(i?1:-1)*1.3));
    u.eyes.visible=true;this.spawnGhost(f);this.game.onVisheshDeath();
   }
   return;
  }
  f.dead+=dt;
  this.updateGhost(f,dt);
  // A beat after the knock-out the body "poofs" into a BGMI-style loot crate.
  if(!f.crate&&f.dead>.7)this.spawnCrate(f);
  if(f.crate){
   const c=f.crate,k=Math.min((f.dead-.7)/.3,1);
   c.userData.body.scale.setScalar(k<1?k*1.15:1);
   c.userData.tag.position.y=1.55+Math.sin(f.dead*2.4)*.07;
  }
  for(const p of f.puffs){
   p.userData.age+=dt;const a=p.userData.age;
   p.position.addScaledVector(p.userData.v,dt);p.scale.setScalar(.3+a*1.6);
   p.material.opacity=Math.max(0,.85-a*1.3);p.visible=a<.7;
  }
 }
 spawnGhost(f){
  const g=ghostModel(...VISHESH),o=f.obj,a=Math.random()*Math.PI*2;
  g.position.set(o.position.x,f.ground+.3,o.position.z);g.rotation.y=o.rotation.y;
  g.userData.drift={x:Math.sin(a)*1.1,z:Math.cos(a)*1.1};
  this.game.scene.add(g);f.ghost=g;f.ghostT=0;
 }
 updateGhost(f,dt){
  const g=f.ghost;if(!g)return;
  f.ghostT+=dt;const t=f.ghostT,u=g.userData;
  // Floats up out of the body, waving goodbye, spiralling off and fading out.
  g.position.y+=(1.3+t*.9)*dt;
  g.position.x+=(u.drift.x+Math.sin(t*2.2)*.8)*dt;
  g.position.z+=(u.drift.z+Math.cos(t*2.2)*.8)*dt;
  g.rotation.y+=1.3*dt;g.rotation.z=Math.sin(t*3)*.18;
  u.arms.forEach((arm,i)=>arm.rotation.set(-2.7+Math.sin(t*9+i*Math.PI)*.45,0,(i?1:-1)*.35));
  u.hips.forEach((h,i)=>h.rotation.set(Math.sin(t*6+i*Math.PI)*.35,0,0));
  const fade=Math.max(0,1-t/4.5);
  u.ghostMaterials[0].opacity=.7*fade;u.ghostMaterials[1].opacity=.9*fade;
  u.ghostMaterials[2].opacity=.95*fade;
  if(t>4.5){this.game.scene.remove(g);u.ghostMaterials.forEach(m=>m.dispose());f.ghost=null}
 }
 spawnCrate(f){
  const o=f.obj,c=crateModel('Vishesh');
  c.position.set(o.position.x,f.ground,o.position.z);c.rotation.y=o.rotation.y;
  c.userData.body.scale.setScalar(.01);
  this.game.scene.remove(o);this.game.scene.add(c);f.crate=c;
  const geo=new THREE.SphereGeometry(.35,8,6);
  for(let i=0;i<10;i++){
   const a=i/10*Math.PI*2,p=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xf4f4f0,
    transparent:true,opacity:.85,depthWrite:false}));
   p.position.set(o.position.x,f.ground+.4,o.position.z);
   p.userData={age:0,v:new THREE.Vector3(Math.cos(a)*2.2,1+Math.random()*1.2,Math.sin(a)*2.2)};
   this.game.scene.add(p);f.puffs.push(p);
  }
  this.game.onCrateDrop();
 }
 clearFallen(){
  const f=this.fallen;if(!f)return;
  const scene=this.game.scene;
  scene.remove(f.obj);
  if(f.ghost){scene.remove(f.ghost);f.ghost.userData.ghostMaterials.forEach(m=>m.dispose())}
  if(f.crate)scene.remove(f.crate);
  for(const p of f.puffs){scene.remove(p);p.material.dispose()}
  if(f.puffs[0])f.puffs[0].geometry.dispose();
  this.fallen=null;
 }
 update(dt,input){
  this.hitCooldown=Math.max(0,this.hitCooldown-dt);
  this.updateFallen(dt);
  const old={x:this.x,z:this.z,yaw:this.yaw},s=this.stats;
  this.steer=lerp(this.steer,input.steer,1-Math.exp(-dt*8*s.handling));
  if(this.heli){
   // Climbs to cruise height (above the tallest roofs) while moving; lands when stopped on clear ground.
   const moving=input.gas||Math.abs(this.speed)>1.2;
   const want=moving||!this.groundClear()?34:0;
   this.alt=Math.max(0,this.alt+clamp((want-this.alt)*1.5,-7,9)*dt);
  }
  const air=this.heli&&this.alt>3;
  const road=air||this.game.world.roadAt(this.x,this.z);
  const abs=Math.abs(this.speed);
  const drag=.19*abs+(road?.33:1.6);
  if(input.brake){
   const v=Math.max(0,abs-s.brake*dt);
   this.speed=Math.sign(this.speed)*v;
  }else{
   const drive=input.gas*s.accel*this.gear;
   const resist=Math.sign(this.speed)*drag;
   this.speed+=drive*dt;
   if(!input.gas&&Math.abs(resist*dt)>Math.abs(this.speed))this.speed=0;
   else this.speed-=resist*dt;
  }
  this.speed=clamp(this.speed,-6.5,road?s.top:7);
  const wheelAngle=this.steer*.52*s.handling/(1+Math.abs(this.speed)*.065);
  this.yaw-=this.speed/2.6*Math.tan(wheelAngle)*dt;
  this.x+=Math.sin(this.yaw)*this.speed*dt;
  this.z+=Math.cos(this.yaw)*this.speed*dt;
  let hit=null;
  const bounds=this.bounds();
  if(!air)for(const c of this.game.world.colliders){
   if(overlap(bounds,c)){hit=c;break}
  }
  if(!hit&&!air)for(const t of this.game.traffic.cars){
   if(overlap(bounds,t.bounds())){hit=t;break}
  }
  if(Math.abs(this.x)>193||Math.abs(this.z)>193)hit=hit||{x:this.x,z:this.z};
  if(hit){
   const impact=Math.max(Math.abs(this.speed),hit.speed?hit.speed*.65:0);
   this.x=old.x;this.z=old.z;this.yaw=old.yaw;this.speed=-this.speed*.13;
   if(this.hitCooldown<=0&&impact>.6){
    this.health=Math.max(0,this.health-Math.max(7,impact*3.4));
    this.hitCooldown=.85;this.game.onCollision(impact);
   }
  }
  this.distance+=Math.hypot(this.x-old.x,this.z-old.z);
  this.sync();
  if(this.heli){
   const k=Math.min(this.alt/3,1);
   this.mesh.rotation.x=clamp(this.speed/s.top,-1,1)*.13*k;
   this.mesh.rotation.z=-this.steer*Math.min(abs/12,1)*.2*k;
  }else this.mesh.rotation.z=-this.steer*Math.min(abs/22,1)*.025;
  for(const p of this.mesh.userData.fronts)p.rotation.y=-wheelAngle;
  for(const w of this.mesh.userData.wheels){w.tire.rotation.x+=this.speed*dt/.37;w.hub.rotation.x+=this.speed*dt/.37}
 }
}

// ---------- Lane traffic / signals / intersection turns ----------
function direction(a,b){
 const d=distance(a,b);return {x:(b.x-a.x)/d,z:(b.z-a.z)/d};
}
function lanePoint(node,dir,along){
 return {x:node.x+dir.x*along-dir.z*4.5,z:node.z+dir.z*along+dir.x*4.5};
}
class TrafficCar {
 constructor(system,a,b,fraction,id){
  this.system=system;this.a=a;this.b=b;this.dir=direction(a,b);
  this.mesh=carModel(id,[0xeee5ce,0xb96d64,0x8aa8b8,0x8c9d7b,0xbaac92][Math.floor(Math.random()*5)]);
  this.system.game.scene.add(this.mesh);this.speed=0;this.yaw=Math.atan2(this.dir.x,this.dir.z);
  this.mode='line';this.path=[lanePoint(a,this.dir,14),lanePoint(b,this.dir,-14)];
  this.segment=0;this.t=fraction;this.cruise=7+Math.random()*3.5;
  this.place();
 }
 bounds(){return {x:this.x,z:this.z,hx:.98,hz:2.1,yaw:this.yaw}}
 place(){
  const a=this.path[this.segment],b=this.path[this.segment+1];
  this.x=lerp(a.x,b.x,this.t);this.z=lerp(a.z,b.z,this.t);
  this.mesh.position.set(this.x,.04,this.z);this.mesh.rotation.y=this.yaw;
 }
 chooseTurn(){
  const choices=this.b.neighbors.filter(n=>n!==this.a);
  this.next=choices[Math.floor(Math.random()*choices.length)]||this.a;
  const out=direction(this.b,this.next),start=this.path.at(-1),end=lanePoint(this.b,out,14);
  const control={x:this.b.x-this.dir.z*4.5-out.z*4.5,
   z:this.b.z+this.dir.x*4.5+out.x*4.5};
  this.path=[];
  for(let i=0;i<=10;i++){
   const t=i/10,u=1-t;
   this.path.push({x:u*u*start.x+2*u*t*control.x+t*t*end.x,
    z:u*u*start.z+2*u*t*control.z+t*t*end.z});
  }
  this.mode='turn';this.segment=0;this.t=0;
 }
 nextLine(){
  this.a=this.b;this.b=this.next;this.dir=direction(this.a,this.b);
  this.path=[lanePoint(this.a,this.dir,14),lanePoint(this.b,this.dir,-14)];
  this.mode='line';this.segment=0;this.t=0;
 }
 update(dt,time){
  const g=this.system.game,p0=this.path[this.segment],p1=this.path[this.segment+1];
  const dx=p1.x-p0.x,dz=p1.z-p0.z,len=Math.hypot(dx,dz)||1;
  const fx=dx/len,fz=dz/len;
  let desired=this.mode==='turn'?5:this.cruise;
  const remain=(1-this.t)*len;
  const red=this.mode==='line'&&!g.world.lightGreen(this.b,Math.abs(this.dir.z)>.5,time);
  if(red)desired=Math.min(desired,Math.sqrt(Math.max(0,remain-.35)*5));
  const objects=g.player.alt>3?this.system.cars:[g.player,...this.system.cars];
  for(const other of objects){
   if(other===this)continue;
   const ox=other.x-this.x,oz=other.z-this.z;
   const ahead=ox*fx+oz*fz,lateral=Math.abs(ox*fz-oz*fx);
   if(ahead>0&&ahead<8+this.speed*1.2&&lateral<2.3)
    desired=Math.min(desired,Math.max(0,(ahead-6)*.8));
  }
  this.speed=lerp(this.speed,desired,1-Math.exp(-dt*2.6));
  if(red&&remain<.45){this.speed=0;return}
  let move=this.speed*dt;
  while(move>0){
   const a=this.path[this.segment],b=this.path[this.segment+1];
   const length=distance(a,b)||.001,remaining=(1-this.t)*length;
   if(move<remaining){this.t+=move/length;move=0}
   else{
    move-=remaining;this.segment++;this.t=0;
    if(this.segment>=this.path.length-1){
     if(this.mode==='line'){
      if(!g.world.lightGreen(this.b,Math.abs(this.dir.z)>.5,time)){
       this.segment=this.path.length-2;this.t=.999;this.speed=0;move=0;break;
      }
      this.chooseTurn();
     }else this.nextLine();
    }
   }
  }
  const a=this.path[this.segment],b=this.path[this.segment+1];
  const target=Math.atan2(b.x-a.x,b.z-a.z);
  this.yaw+=angleDiff(target,this.yaw)*(1-Math.exp(-dt*9));
  this.place();
  for(const w of this.mesh.userData.wheels)w.tire.rotation.x+=this.speed*dt/.37;
 }
 dispose(){
  this.system.game.scene.remove(this.mesh);

  for(let attempt=0;attempt<30;attempt++){
   const a=nodes[Math.floor(Math.random()*nodes.length)];
   const b=a.neighbors[Math.floor(Math.random()*a.neighbors.length)];
   const dir=direction(a,b),t=.1+Math.random()*.8;
   const start=lanePoint(a,dir,14),end=lanePoint(b,dir,-14);
   const p={x:lerp(start.x,end.x,t),z:lerp(start.z,end.z,t)};
   if(distance(p,this.game.player)<25||this.cars.some(c=>distance(p,c)<14))continue;
   this.cars.push(new TrafficCar(this,a,b,t,Math.floor(Math.random()*4)));return;
  }
 }
 update(dt,time){
  this.spawnTimer+=dt;
  if(this.spawnTimer>2&&this.cars.length<this.target){this.spawn();this.spawnTimer=0}

  this.mount=null;this.mountKey='';this.cooldown=0;this.jokeTimer=0;this.hudTimer=0;this.lastJoke=-1;

 }

  const scene=this.game.scene;
  for(const e of this.enemies)if(!e.gone)this.removeEnemy(e);
  for(const s of this.shots)scene.remove(s.mesh);
  for(const f of this.fx){scene.remove(f.mesh);f.mesh.material.dispose()}
  if(this.crate?.obj){scene.remove(this.crate.obj);this.crate.obj.userData.tag.material.dispose()}
  this.enemies=[];this.shots=[];this.fx=[];this.crate=null;this.army={total:0,down:0};

  this.jokeTimer=0;$('jokeBubble').classList.add('hidden');this.game.audio.hush();

   if(c.h>1&&Math.abs(x-c.x)<c.hx+r&&Math.abs(z-c.z)<c.hz+r)return true;

 // o: hp, x, z, yaw, base (origin height above ground), cy (aim height), radius, speed,

  const s=o.scale||1,bar=hpBar();

  mesh.scale.setScalar(s);mesh.rotation.order='YXZ';mesh.rotation.y=o.yaw||0;
  const e={kind,mesh,bar,hp:o.hp,max:o.hp,x:o.x,z:o.z,yaw:o.yaw||0,base:o.base,cy:o.cy,
   radius:o.radius,speed:o.speed,reach:o.reach,bite:o.bite,scale:s,rise:o.rise??1,
   walk:Math.random()*6,hitCd:1,flash:0,ghost:0,stuck:0,dead:0,gone:false};

 // ---- shooting ----
 fire(held){
  const g=this.game,d=g.save.data;
  if(g.state!=='playing'||this.cooldown>0)return;
  if(this.phase==='idle'){
   if(!held)g.ui.notice(d.weapons.length?'No enemies here · play the Vishesh Boss Hunt level 💀':
    'No weapons yet · visit Nexdew Technologies ⚡ next to the start',2);
   return;
  }
  if(d.activeWeapon<0){if(!held)g.ui.notice('🔫 No weapon! Visit Nexdew Technologies ⚡ next to the start',2.2);return}
  const w=WEAPONS[d.activeWeapon],target=this.nearest();
  if(!target){
   this.cooldown=.25;
   if(!held)g.ui.notice(this.phase==='crate'?'📦 Wait for it…':this.phase==='cleared'?'Level cleared! 🏆':
    `No target within ${RANGE} m`,1.2);
   return;
  }
  const origin=this.muzzle(),m=new THREE.Mesh(this.fxGeometry,this.shotMaterial(w.color));
  m.scale.setScalar(w.size);m.position.copy(origin);g.scene.add(m);
  this.cooldown=w.cooldown;
  this.shots.push({mesh:m,w,target,age:0,
   vel:this.center(target).sub(origin).normalize().multiplyScalar(w.speed)});
  this.burst(origin,w.color,4,1.5,w.size*.6,.2);g.audio.gunshot(d.activeWeapon);
  if(w.damage>=999)g.ui.notice('☢️ DESI NUKE INBOUND!',1.4);

  const p=this.game.player;let best=null,bestD=range;
  for(const e of this.enemies){
   if(e.hp<=0||e.rise<.6)continue;
   const d=Math.hypot(e.x-p.x,e.z-p.z);if(d<bestD){bestD=d;best=e}
  }

 }

 updateShots(dt){
  for(let i=this.shots.length-1;i>=0;i--){
   const s=this.shots[i],pos=s.mesh.position;s.age+=dt;
   let hit=false;
   if(s.target.hp>0){
    const to=this.center(s.target).sub(pos),d=to.length();
    if(d<s.target.radius*.7+s.w.speed*dt)hit=true;

   }
   if(hit)this.impact(s,pos.clone());
   else pos.addScaledVector(s.vel,dt);

   if(e!==s.target&&e.hp>0&&e.rise>=.6&&Math.hypot(e.x-pos.x,e.z-pos.z)<=w.splash+e.radius)victims.push(e);
  for(const e of victims)this.damage(e,w.damage);

   this.blast(pos,0xfff1a8,w.splash,1.1);this.blast(pos,0xff7a1a,w.splash*.6,1.4);

  e.stuck=Math.hypot(e.x-ox,e.z-oz)<step*.3?e.stuck+dt:0;

class CameraController {
 constructor(game){this.game=game;this.look=new THREE.Vector3();this.shake=0}

  const p=this.game.player,k=CARS[p.id].cam||1;
  this.game.camera.position.set(p.x-Math.sin(p.yaw)*10*k,p.alt+6.3*k,p.z-Math.cos(p.yaw)*10*k);
  this.look.set(p.x,p.alt+1.3*k,p.z);this.game.camera.lookAt(this.look);
 }
 update(dt,time){
  const g=this.game,p=g.player,cam=g.camera,k=CARS[p.id].cam||1;
  let desired,look;
  if(['menu','garage','settings','missions'].includes(g.state)){
   const a=time*.085;
   desired=new THREE.Vector3(p.x+Math.sin(a)*10*k,6.5*k,p.z+Math.cos(a)*10*k);
   look=new THREE.Vector3(p.x,k,p.z);
  }else{
   const reverse=p.gear===-1&&p.speed<-.3?-1:1;
   const back=(9+Math.abs(p.speed)*.1)*k;
   desired=new THREE.Vector3(
    p.x-Math.sin(p.yaw)*back*reverse,p.alt+(5.5+Math.abs(p.speed)*.045)*k,
    p.z-Math.cos(p.yaw)*back*reverse);
   look=new THREE.Vector3(p.x+Math.sin(p.yaw)*3*k*reverse,p.alt+1.2*k,
    p.z+Math.cos(p.yaw)*3*k*reverse);
  }
  cam.position.lerp(desired,1-Math.exp(-dt*5));
  this.look.lerp(look,1-Math.exp(-dt*7));cam.lookAt(this.look);
  if(this.shake>0){
   cam.position.x+=(Math.random()-.5)*this.shake;
   cam.position.y+=(Math.random()-.5)*this.shake*.4;
   this.shake=Math.max(0,this.shake-dt*1.5);
  }
 }
}

// ---------- Mission logic / goal visuals ----------
class MissionSystem {
 constructor(game){
  this.game=game;this.marker=new THREE.Group();game.scene.add(this.marker);
  const ringMat=new THREE.MeshBasicMaterial({color:0x65edbe,transparent:true,
   opacity:.8,side:THREE.DoubleSide,depthWrite:false});
  this.ring=new THREE.Mesh(new THREE.RingGeometry(5.5,6.1,48),ringMat);
  this.ring.rotation.x=-Math.PI/2;this.ring.position.y=.13;this.marker.add(this.ring);
  const beamMat=new THREE.MeshBasicMaterial({color:0x65edbe,transparent:true,
   opacity:.075,side:THREE.DoubleSide,depthWrite:false});
  this.beam=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,14,16,1,true),beamMat);
  this.beam.position.y=7;this.marker.add(this.beam);
  this.chevron=new THREE.Group();this.marker.add(this.chevron);
  const a=box(this.chevron,.25,.1,2,0x65edbe,-.58,.16,0,false);
  const b=box(this.chevron,.25,.1,2,0x65edbe,.58,.16,0,false);
  a.rotation.y=-.65;b.rotation.y=.65;
  this.parking=new THREE.Group();this.marker.add(this.parking);
  for(const x of [-1.65,1.65])box(this.parking,.13,.04,6.4,0x65edbe,x,.12,0,false);
  for(const z of [-3.2,3.2])box(this.parking,3.4,.04,.13,0x65edbe,0,.12,z,false);
  this.marker.visible=false;
 }
 start(id){
  this.id=id;this.def=MISSIONS[id];this.index=0;this.remaining=this.def.time;
  this.hold=0;this.collisions=0;this.boss=this.def.type==='boss';
  this.marker.visible=!this.boss;this.updateMarker();
 }
 target(){
  if(this.boss)return this.game.bossSystem.target();
  const p=this.def.points[Math.min(this.index,this.def.points.length-1)];
  return {x:p[0],z:p[1]};
 }
 isParking(){return this.def.type==='parking'&&this.index===this.def.points.length-1}
 updateMarker(){
  const p=this.target(),park=this.isParking();
  this.marker.position.set(p.x,0,p.z);
  this.parking.visible=park;this.ring.visible=!park;this.beam.visible=true;
  this.chevron.rotation.y=park?this.def.parkYaw:0;
  this.parking.rotation.y=park?this.def.parkYaw:0;
 }
 update(dt){
  const g=this.game,p=g.player;
  if(this.boss&&g.bossSystem.phase==='cleared')return; // victory lap: the clock stops
  this.remaining=Math.max(0,this.remaining-dt);
  if(this.remaining<=0){g.finish(false,this.boss?'Time ran out. Vishesh and his army are still out there… 💀':
   'Time ran out. Try a smoother, faster route.');return}
  if(p.health<=0){g.finish(false,this.boss?'The skeleton army wrecked your car. Buy a stronger weapon and try again!':
   'Your car took too much damage.');return}
  if(this.boss)return; // BossSystem ends the level when the army is cleared
  const dest=this.target(),d=distance(p,dest);
  this.beam.material.opacity=.065+Math.sin(g.playTime*3)*.025;
  if(this.isParking()){
   const dx=p.x-dest.x,dz=p.z-dest.z,angle=this.def.parkYaw;
   const lateral=Math.abs(dx*Math.cos(angle)-dz*Math.sin(angle));
   const longitudinal=Math.abs(dx*Math.sin(angle)+dz*Math.cos(angle));
   const aligned=Math.abs(angleDiff(p.yaw,angle))<.23;
   const inside=lateral<.65&&longitudinal<1.05;
   const stopped=Math.abs(p.speed)<.35&&p.alt<.3;
   if(inside&&aligned&&stopped)this.hold+=dt;
   else this.hold=Math.max(0,this.hold-dt*2);
   if(this.hold>=2){g.finish(true);return}
   this.parkHint=d>10?'Reach the parking bay':
    !inside?'Center your car in the bay':
    !aligned?'Face the painted arrow':
    !stopped?(p.alt>=.3?'Stop and land in the bay':'Brake to a complete stop'):
    `Hold still… ${Math.ceil((2-this.hold)*10)/10}s`;
  }else if(d<9){
   g.audio.checkpoint();this.index++;
   if(this.index>=this.def.points.length){g.finish(true);return}
   this.updateMarker();g.ui.notice('Checkpoint reached',1.25);
  }
 }
 collision(){
  this.collisions++;
  if(this.def.type==='clean')this.game.finish(false,'Clean-driving mission: a collision ended the trip.');
 }
}

class UI {
 constructor(game){
  this.game=game;this.preview=game.save.data.selected;this.noticeTimer=0;this.hudTimer=0;
  $('pauseButton').onclick=()=>game.pause();
 }
 header(title){
  return `<div class="topline"><div class="eyebrow">CITY SHIFT</div>
   <div class="coins">● ${this.game.save.data.coins.toLocaleString()}</div></div><h2>${title}</h2>`;
 }
 button(id,label,kind=''){return `<button class="btn ${kind}" id="${id}">${label}</button>`}
 show(html){
  $('screen').innerHTML=`<section class="panel">${html}</section>`;
  $('screen').classList.remove('hidden');
  $('hud').classList.add('hidden');$('input').classList.add('hidden');
 }
 bind(id,fn){
  const e=$(id);if(!e)return;
  e.onclick=()=>{this.game.audio.init();this.game.audio.click();fn()};
 }
 menu(){
  const g=this.game;g.state='menu';g.mission.marker.visible=false;g.input.clear();
  g.bossSystem?.reset(false);g.player.setCar(g.save.data.selected);g.player.reset();
  const count=Object.keys(g.save.data.completed).length;
  this.show(`<div class="topline"><span class="eyebrow">MODEL TOWN → SONDHAPUR · PANIPAT</span>
    <span class="coins">● ${g.save.data.coins.toLocaleString()}</span></div>
   <h1>CITY SHIFT</h1>
   <p>Take the wheel with Jatin and Vishesh. Drive Model Town’s colony lanes and market,
    head west on Jattal Road to Sondhapur village, and push out onto G.T. Road.</p>
   <span class="badge">${count} / ${MISSIONS.length} MISSIONS COMPLETE</span>
   ${this.button('play','Start Driving','primary full')}
   <div class="grid2" style="margin-top:10px">
    ${this.button('garage','Garage & Upgrades')}${this.button('settings','Settings')}</div>
   <div id="footer" class="small">Touch: drag wheel · hold pedals · D/R switches gear<br>
    Keyboard: WASD / arrows · R reverse · Esc pause · F fire · Q switch weapon<br>
    Double-tap your vehicle (or press V) to make Vishesh jump<br>
    Nexdew Technologies (next to the start) sells weapons for the Vishesh Boss Hunt<br>
    ${g.save.available?'Progress saves automatically on this browser.':
     'Storage unavailable: progress may not survive closing the page.'}</div>`);
  this.bind('play',()=>this.missions());this.bind('garage',()=>this.garage());
  this.bind('settings',()=>this.settings());
 }
 missions(){
  const g=this.game;g.state='missions';
  this.show(this.header('Choose your shift')+
   `<div class="cards">${MISSIONS.map((m,i)=>{
    const unlocked=g.save.unlockedMission(i),done=g.save.data.completed[i];
    return `<button class="card" id="mission${i}" ${!unlocked?'disabled':''}>
     <b>${unlocked?'':'🔒 '}${i+1}. ${m.name}
      ${done?`<span style="color:var(--gold)"> ${'★'.repeat(done.stars)}</span>`:''}</b>
     <span>${m.type.toUpperCase()} · ${m.time}s · ${m.reward}+ coins</span></button>`;
   }).join('')}</div>`+this.button('back','Back','full'));
  MISSIONS.forEach((_,i)=>this.bind('mission'+i,()=>this.brief(i)));
  this.bind('back',()=>this.menu());
 }
 brief(id){
  const g=this.game,m=MISSIONS[id];
  const rules=m.type==='boss'?`${m.time} seconds · Vishesh 300 HP → his crate → Skeleton Vishesh on a
   black bull (150 HP) + 6 skeleton warriors (50 HP each) · they hit your car, so keep moving`:
   `${m.time} seconds · ${m.points.length} objectives ·
   ${m.type==='clean'?'Zero collisions allowed':'Do not wreck your car'}`;
  this.show(this.header(m.name)+`<p>${m.text}</p>
   <div class="cards"><div class="card"><b>Mission rules</b>
   <span>${rules}</span></div>
   <div class="card"><b>Rewards</b><span>${m.reward} base coins + condition/time bonus.
   First completion adds 150 coins.</span></div></div>
   <p class="small">Traffic uses right-hand lanes. Brake before corners.
   For reverse, stop and tap D ⇄ R, then use the accelerator.
   Green rings mark your route.</p>`+
   this.button('begin','Begin Mission','primary full')+this.button('back','Back','full'));
  this.bind('begin',()=>g.start(id));this.bind('back',()=>this.missions());
 }
 garage(){
  const g=this.game;g.state='garage';g.mission.marker.visible=false;
  this.preview=clamp(this.preview,0,CARS.length-1);
  const id=this.preview,c=CARS[id],owned=g.save.data.owned.includes(id);
  const s=g.save.stats(id),u=g.save.levels(id);g.player.setCar(id);g.player.reset();
  this.show(this.header('Garage')+
   `<div class="row">${this.button('previous','‹')}
   <div style="text-align:center"><h3 style="color:#${c.color.toString(16).padStart(6,'0')}">${c.name}</h3>
   <span class="small">${c.tag}</span></div>${this.button('next','›')}</div>
   <div class="grid2">
   ${this.stat('Acceleration',s.accel.toFixed(1)+' m/s²',s.accel/12)}
   ${this.stat('Top speed',Math.round(s.top*3.6)+' km/h',s.top/43)}
   ${this.stat('Braking',s.brake.toFixed(1)+' m/s²',s.brake/20)}
   ${this.stat('Handling',s.handling.toFixed(2)+'×',s.handling/1.8)}
   </div>
   ${owned?this.button('select',g.save.data.selected===id?'Selected ✓':'Select Vehicle','primary full'):
     this.button('buy',`Unlock · ${c.price} coins`,'gold full')}
   <h3 style="margin-top:22px">Upgrades</h3>
   <div class="cards">${['engine','handling','brakes','speed'].map(key=>{
    const lv=u[key],cost=g.economy.cost(id,key);
    return `<div class="card row" style="margin:0"><div><b style="text-transform:capitalize">${key}</b>
     <span>Level ${lv} / 3</span></div>
     <button class="btn" id="up-${key}" ${!owned||lv>=3||g.save.data.coins<cost?'disabled':''}>
      ${lv>=3?'MAX':cost+' ●'}</button></div>`;
   }).join('')}</div>`+this.button('back','Back to Menu','full'));
  if(!owned&&g.save.data.coins<c.price)$('buy').disabled=true;
  this.bind('previous',()=>{this.preview=(id+CARS.length-1)%CARS.length;this.garage()});
  this.bind('next',()=>{this.preview=(id+1)%CARS.length;this.garage()});
  this.bind('select',()=>{g.save.data.selected=id;g.save.write();this.garage()});
  this.bind('buy',()=>{g.economy.buyCar(id);this.garage()});
  for(const key of ['engine','handling','brakes','speed'])
   this.bind('up-'+key,()=>{g.economy.upgrade(id,key);this.garage()});
  this.bind('back',()=>this.menu());
 }
 stat(name,value,fraction){
  return `<div class="stat">${name} <b style="float:right;color:white">${value}</b>
   <div class="bar"><i style="width:${clamp(fraction,0,1)*100}%"></i></div></div>`;
 }
 settings(){
  const g=this.game;g.state='settings';const s=g.save.data.settings;
  this.show(this.header('Settings')+
   `<div class="card row"><div><b>Generated audio</b><span>Engine, city, and effects</span></div>
   ${this.button('sound',s.sound?'ON':'OFF')}</div>
   <div class="card row"><div><b>Graphics quality</b><span>Low disables shadows and reduces resolution</span></div>
   ${this.button('quality',s.quality.toUpperCase())}</div>
   <p class="small">Landscape is recommended, but portrait is supported.
   On mobile, use your browser’s Add to Home Screen option for a larger play area.
   Saves are local to this browser and website.</p>`+
   this.button('back','Back','full'));
  this.bind('sound',()=>{g.audio.setEnabled(!s.sound);this.settings()});
  this.bind('quality',()=>{
   s.quality=s.quality==='high'?'low':'high';g.save.write();g.applyQuality();this.settings();
  });
  this.bind('back',()=>this.menu());
 }
 driving(){
  $('screen').classList.add('hidden');$('hud').classList.remove('hidden');
  $('input').classList.remove('hidden');
 }
 pause(){
  const g=this.game;
  this.show(this.header('Shift paused')+`<p>Your mission timer is stopped.</p>`+
   this.button('resume','Resume','primary full')+
   this.button('retry','Restart Mission','full')+
   this.button('quit','Quit to Menu','full'));
  this.bind('resume',()=>g.resume());
  this.bind('retry',()=>g.start(g.mission.id));this.bind('quit',()=>this.menu());
 }
 result(win,reason,reward){
  const g=this.game,m=g.mission;
  this.show(this.header(win?'Shift complete!':'Shift ended')+
   (win?`<div style="font-size:35px;color:var(--gold);letter-spacing:8px">
    ${'★'.repeat(reward.stars)}${'☆'.repeat(3-reward.stars)}</div>
    <p>${m.def.name} completed.</p>
    <div class="card"><b class="coins">+ ${reward.amount} coins</b>
    <span>${reward.first?'Includes first-completion bonus · ':''}
     ${Math.ceil(g.player.health)}% condition · ${Math.floor(m.remaining)} seconds left</span></div>`:
    `<p>${reason}</p><div class="card"><b>No reward this time</b>
     <span>Your saved vehicles and upgrades are unchanged.</span></div>`)+
   `<p class="small">${Math.round(g.player.distance)} m driven · ${m.collisions} collisions</p>`+
   (win&&m.id<MISSIONS.length-1?this.button('nextMission','Next Mission','primary full'):
    this.button('retry','Try Again','primary full'))+
   `<div class="grid2" style="margin-top:10px">${this.button('garage','Garage')}
    ${this.button('missions','Missions')}</div>`+
   this.button('menu','Main Menu','full'));
  this.bind('nextMission',()=>this.brief(m.id+1));
  this.bind('retry',()=>g.start(m.id));
  this.bind('garage',()=>{this.preview=g.save.data.selected;this.garage()});
  this.bind('missions',()=>this.missions());this.bind('menu',()=>this.menu());
 }
 weaponStore(){
  const g=this.game,d=g.save.data;g.state='store';g.input.clear();
  const rows=WEAPONS.map((w,i)=>{
   const owned=d.weapons.includes(i),active=d.activeWeapon===i,nuke=w.damage>=999;
   return `<div class="card row" style="margin:0${active?';border-color:var(--accent)':''}"><div>
    <b>${w.emoji} ${w.name}</b>
    <span>${nuke?'Instant kill':w.damage+' damage'} per hit · ${w.cooldown}s reload${w.splash?` · ${w.splash} m blast`:''}<br>
    ${nuke?'One shot clears a crowd':`Vishesh in ${Math.ceil(300/w.damage)} hits · skeleton in ${Math.ceil(50/w.damage)}`}
    · ${w.desc}</span></div>
    ${this.button('weapon'+i,active?'Equipped ✓':owned?'Equip':w.price+' ●',active?'primary':owned?'':'gold')}</div>`;
  }).join('');
  this.show(this.header('Nexdew Technologies')+
   `<div class="row" style="justify-content:flex-start"><img src="${ND_LOGO}" alt="ND logo"
    style="height:46px;background:#fff;border-radius:10px;padding:5px">
   <p style="margin:0">Weapon store &amp; vehicle mods. Your weapon is bolted onto your ride and auto-aims at the
    nearest enemy within ${RANGE} m.</p></div>
   <div class="cards">${rows}</div>
   <p class="small">Vishesh 300 HP · Skeleton Vishesh on the black bull 150 HP · skeleton warriors 50 HP each.
    Kills pay a bounty (150 / 120 / 40 ●). F or FIRE shoots (hold for auto-fire) · Q or tap the weapon badge to switch.
    Vishesh cracks a joke every ${JOKE_EVERY} hits.</p>`+
   this.button('leave','Back to the road','primary full'));
  WEAPONS.forEach((w,i)=>{
   if(!d.weapons.includes(i)&&d.coins<w.price)$('weapon'+i).disabled=true;
   this.bind('weapon'+i,()=>{
    if(d.weapons.includes(i))g.economy.selectWeapon(i);
    else if(g.economy.buyWeapon(i))g.audio.checkpoint();
    this.weaponStore();
   });
  });
  this.bind('leave',()=>g.closeStore());
 }
 notice(text,seconds=2){
  $('notice').textContent=text;$('notice').style.opacity=1;this.noticeTimer=seconds;
 }
 update(dt){
  if(this.noticeTimer>0){this.noticeTimer-=dt;if(this.noticeTimer<=0)$('notice').style.opacity=0}
  if(this.game.state!=='playing')return;
  this.hudTimer+=dt;if(this.hudTimer<.08)return;this.hudTimer=0;
  const g=this.game,p=g.player,m=g.mission,dest=m.target(),d=distance(p,dest);
  $('speed').textContent=Math.round(Math.abs(p.speed)*3.6);
  $('gearReadout').textContent=p.gear===1?'D · DRIVE':'R · REVERSE';
  $('reverse').textContent=p.gear===1?'D ⇄ R':'R ⇄ D';
  $('distanceReadout').textContent=Math.round(p.distance)+' m';
  const t=Math.ceil(m.remaining);
  $('timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  $('timer').style.color=t<20?'#ff998b':'#f2f7fa';
  $('health').textContent='CAR '+Math.ceil(p.health)+'%';
  $('health').style.color=p.health<35?'#ff998b':'#65edbe';
  const boss=m.boss?g.bossSystem:null;
  $('objectiveTitle').textContent=m.def.name;
  $('objectiveDetail').textContent=boss?boss.objective():m.isParking()?m.parkHint||'Reach the parking bay':
   `Checkpoint ${m.index+1} / ${m.def.points.length} · ${
    m.def.type==='clean'?'No collisions allowed':'Follow the green rings'}`;
  $('objectiveProgress').firstElementChild.style.width=(boss?boss.progress()*100:
   (m.index+(m.isParking()?m.hold/2:0))/m.def.points.length*100)+'%';
  $('navDistance').textContent=Math.round(d)+' m';
  $('navHint').textContent=boss?boss.navHint():m.isParking()?'PARK & HOLD':'NEXT CHECKPOINT';
  const targetAngle=Math.atan2(dest.x-p.x,dest.z-p.z);
  $('navArrow').style.transform=`rotate(${-angleDiff(targetAngle,p.yaw)*180/Math.PI}deg)`;
  this.drawMap();
 }
 drawMap(){
  const ctx=$('map').getContext('2d'),g=this.game,m=g.mission;
  const size=288,scale=.72,origin=144;
  const xy=(x,z)=>[origin+x*scale,origin+z*scale];
  ctx.clearRect(0,0,size,size);ctx.fillStyle='#27423d';ctx.fillRect(0,0,size,size);
  // District tints: Sondhapur fields/village (west), Model Town (east).
  ctx.fillStyle='#4a4a2c';ctx.fillRect(...xy(-178,-178),98*scale,356*scale);
  ctx.fillStyle='#2c4a4a';ctx.fillRect(...xy(0,-178),178*scale,356*scale);
  ctx.lineWidth=14;ctx.strokeStyle='#62757b';
  for(const n of GRID){
   ctx.beginPath();ctx.moveTo(...xy(n,-178));ctx.lineTo(...xy(n,178));ctx.stroke();
   ctx.beginPath();ctx.moveTo(...xy(-178,n));ctx.lineTo(...xy(178,n));ctx.stroke();
  }
  // Named roads: Jattal Road (z=0) and G.T. Road / NH-44 (x=160).
  ctx.strokeStyle='#8a8f74';ctx.beginPath();ctx.moveTo(...xy(-178,0));ctx.lineTo(...xy(0,0));ctx.stroke();
  ctx.strokeStyle='#9a8466';ctx.beginPath();ctx.moveTo(...xy(160,-178));ctx.lineTo(...xy(160,178));ctx.stroke();
  ctx.fillStyle='#d98c3c';ctx.fillRect(...xy(DISTRICTS.gateX-1.5,-12),3*scale*1.4,24*scale);
  ctx.font='800 15px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const [text,x,z,color] of DISTRICTS.labels){
   ctx.fillStyle='#0009';ctx.fillText(text,...xy(x+1,z+1.5));
   ctx.fillStyle=color;ctx.fillText(text,...xy(x,z));
  }
  ctx.save();ctx.translate(...xy(160,-100));ctx.rotate(-Math.PI/2);
  ctx.fillStyle='#fff';ctx.fillText('NH-44',0,0);ctx.restore();
  if(!m.boss){
   ctx.lineWidth=3;ctx.strokeStyle='#65edbe';ctx.setLineDash([5,4]);ctx.beginPath();
   const previous=m.index===0?[4,32]:m.def.points[m.index-1];
   ctx.moveTo(...xy(...previous));
   for(let i=m.index;i<m.def.points.length;i++)ctx.lineTo(...xy(...m.def.points[i]));
   ctx.stroke();ctx.setLineDash([]);
  }
  for(const t of g.traffic.cars){
   const [x,y]=xy(t.x,t.z);ctx.fillStyle='#e8c993';ctx.fillRect(x-2,y-2,4,4);
  }
  // Nexdew Technologies store.
  const [sx,sy]=xy(STORE.x,STORE.z);
  ctx.fillStyle='#0d2231';ctx.strokeStyle='#65edbe';ctx.lineWidth=2;
  ctx.fillRect(sx-9,sy-9,18,18);ctx.strokeRect(sx-9,sy-9,18,18);
  ctx.fillStyle='#65edbe';ctx.font='900 10px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('ND',sx,sy+1);
  if(m.boss)g.bossSystem.drawMap(ctx,xy);
  else{
   const target=m.target(),[tx,ty]=xy(target.x,target.z);
   ctx.fillStyle='#65edbe';ctx.beginPath();ctx.arc(tx,ty,7,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#174538';ctx.font='bold 10px sans-serif';ctx.textAlign='center';
   ctx.fillText(m.isParking()?'P':'•',tx,ty+3);
  }
  const [px,py]=xy(g.player.x,g.player.z);
  ctx.save();ctx.translate(px,py);ctx.rotate(-g.player.yaw);
  ctx.fillStyle='#fff';ctx.strokeStyle='#193343';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,8);ctx.lineTo(-5,-5);ctx.lineTo(5,-5);ctx.closePath();
  ctx.fill();ctx.stroke();ctx.restore();
 }
}

// ---------- Game state / fixed-step loop / lifecycle ----------
class Game {
 constructor(){
  this.state='boot';this.playTime=0;this.visualTime=0;
  this.save=new SaveSystem();this.economy=new Economy(this.save);
  this.audio=new AudioSystem(this.save);
  this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0xa7d3e6);
  this.scene.fog=new THREE.Fog(0xa7d3e6,95,265);
  this.renderer=new THREE.WebGLRenderer({canvas:$('view'),antialias:true,powerPreference:'high-performance'});
  this.renderer.outputColorSpace=THREE.SRGBColorSpace;
  this.renderer.toneMapping=THREE.ACESFilmicToneMapping;this.renderer.toneMappingExposure=1.13;
  this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  this.camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.15,350);
  this.scene.add(new THREE.HemisphereLight(0xe5f6ff,0x667b53,2.5));
  this.sun=new THREE.DirectionalLight(0xfff0ce,2.5);
  this.sun.position.set(-35,65,30);this.sun.castShadow=true;
  this.sun.shadow.mapSize.set(1024,1024);
  Object.assign(this.sun.shadow.camera,{left:-48,right:48,top:48,bottom:-48,near:1,far:160});
  this.sun.shadow.bias=-.0004;this.sun.shadow.normalBias=.035;
  this.scene.add(this.sun);this.scene.add(this.sun.target);
  this.world=new World(this.scene);
  this.player=new VehicleController(this);
  this.traffic=new TrafficSystem(this);
  this.mission=new MissionSystem(this);
  this.input=new InputSystem(this);
  this.cameraController=new CameraController(this);
  this.ui=new UI(this);
  this.bossSystem=new BossSystem(this);
  this.traffic.reset(9);this.world.update(0);
  this.applyQuality();this.resize();
  window.addEventListener('resize',()=>this.resize());
  $('view').addEventListener('webglcontextlost',e=>{
   e.preventDefault();if(this.state==='playing')this.pause();
   $('loading').classList.remove('hidden');
   $('loadMessage').textContent='Graphics context was interrupted. Reload this page to resume from saved progression.';
  });
  this.cameraController.snap();this.ui.menu();$('loading').classList.add('hidden');
  this.last=performance.now();this.accumulator=0;
  requestAnimationFrame(t=>this.frame(t));
 }
 applyQuality(){
  const high=this.save.data.settings.quality==='high';
  this.renderer.setPixelRatio(Math.min(devicePixelRatio||1,high?1.6:1));
  this.renderer.shadowMap.enabled=high;this.sun.castShadow=high;
  this.scene.traverse(o=>{if(o.isMesh&&o.material){
   const list=Array.isArray(o.material)?o.material:[o.material];
   list.forEach(m=>m.needsUpdate=true);
  }});
 }
 resize(){
  this.renderer.setSize(innerWidth,innerHeight,false);
  this.camera.aspect=innerWidth/innerHeight;
  this.camera.fov=innerWidth<innerHeight?66:58;this.camera.updateProjectionMatrix();
 }
 start(id){
  if(!this.save.unlockedMission(id))return;
  this.audio.init();this.input.clear();
  this.player.setCar(this.save.data.selected);this.player.reset();
  this.playTime=0;this.accumulator=0;this.traffic.reset(MISSIONS[id].traffic);
  const boss=MISSIONS[id].type==='boss';this.bossSystem.reset(boss);
  this.mission.start(id);this.world.update(0);this.state='playing';
  this.cameraController.snap();this.ui.driving();
  this.ui.notice(boss?'💀 Boss Hunt! Arm up at Nexdew Technologies ⚡ then hunt Vishesh':
   'Shift started · Follow the green route',2.8);
 }
 openStore(){
  if(this.state!=='playing')return;
  this.audio.init();this.ui.weaponStore();
 }
 closeStore(){
  if(this.state!=='store')return;
  this.state='playing';this.input.clear();this.accumulator=0;this.ui.driving();
 }
 pause(){
  if(this.state!=='playing')return;
  this.state='paused';this.input.clear();this.ui.pause();
 }
 resume(){
  if(this.state!=='paused')return;
  this.state='playing';this.input.clear();this.accumulator=0;this.ui.driving();
 }
 toggleGear(){
  if(this.state!=='playing')return;
  this.audio.init();
  if(Math.abs(this.player.speed)>.6){this.ui.notice('Stop before changing gear',1.6);return}
  this.player.gear*=-1;this.player.speed=0;this.audio.click();
  this.ui.notice(this.player.gear===1?'Drive selected':'Reverse selected',1);
 }
 visheshJump(){
  if(this.state!=='playing')return;
  this.audio.init();
  const r=this.player.jumpVishesh();
  if(r==='none')this.ui.notice('No Vishesh on board',2);
  else if(r==='gone')this.ui.notice('Vishesh is already gone… only his crate is left 📦',1.8);
  else{this.audio.visheshJump();this.ui.notice('Vishesh jumped! 😱',1.4)}
 }
 onVisheshDeath(){
  this.audio.visheshDeath();this.audio.ghost();this.cameraController.shake=.35;
  this.ui.notice('Vishesh knocked out 💀 · his ghost flies away 👻',2.2);
 }
 onCrateDrop(){
  this.audio.crateDrop();
  this.ui.notice('📦 Vishesh’s crate dropped · R.I.P. Vishesh',2.6);
 }
 onCollision(impact){
  this.audio.crash();this.cameraController.shake=Math.min(.65,impact*.035);
  this.ui.notice('Collision · Vehicle damaged',1.5);this.mission.collision();
 }
 finish(win,reason=''){
  if(this.state!=='playing')return;
  this.state='result';this.input.clear();this.mission.marker.visible=false;
  const reward=win?this.economy.reward(this.mission.id,this.player.health,this.mission.remaining):null;
  this.audio.result(win);this.ui.result(win,reason,reward);
 }
 step(dt){
  if(this.state!=='playing')return;
  this.playTime+=dt;
  const input=this.input.sample();
  this.traffic.update(dt,this.playTime);
  this.player.update(dt,input);
  if(this.state==='playing')this.mission.update(dt);
  this.world.update(this.playTime);
  this.bossSystem.update(dt);
 }
 frame(now){
  const dt=Math.min((now-this.last)/1000,.1);this.last=now;this.visualTime+=dt;
  this.accumulator+=dt;
  let steps=0;
  while(this.accumulator>=1/60&&steps<6){
   this.step(1/60);this.accumulator-=1/60;steps++;
  }
  if(steps===6)this.accumulator=0;
  this.cameraController.update(dt,this.visualTime);
  const p=this.player;p.spin(dt,this.state==='playing');
  this.sun.position.set(p.x-35,65,p.z+30);
  this.sun.target.position.set(p.x,0,p.z);this.sun.target.updateMatrixWorld();
  const input=this.input.sample();
  this.audio.update(p.speed,input.gas,input.brake,this.state==='playing');
  this.ui.update(dt);this.renderer.render(this.scene,this.camera);
  requestAnimationFrame(t=>this.frame(t));
 }
}
try {
 const game=new Game();
 window.cityShift=game;
} catch(e) {
 console.error(e);
 $('loading').classList.remove('hidden');
 $('loadMessage').textContent=
  'The game could not initialize. Enable WebGL/hardware acceleration and try a current browser. Details: '+e.message;
}
</script>
